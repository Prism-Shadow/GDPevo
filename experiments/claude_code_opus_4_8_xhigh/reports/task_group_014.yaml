  risks_or_notes:
  - No contamination reports were present in completed formal attempts.
  - Solver efficiency excludes skill generation, environment checks, evaluator execution,
    and main-agent aggregation.
  - The .env file was absent, so the orchestrator used the guide-specified owner/base
    URL/judge path values and recorded them in scratch/environment.md.
  - Claude Code session limits paused the run twice, including a reset wait until
    2026-07-25T22:11:08Z; one OAuth refresh failure also paused the run. Invalid attempts
    from those interruptions were archived and are excluded from the 60 completed
    formal attempts.
  - The read-only task environment exposed business records from multiple case namespaces
    (including train/test-style record IDs). Solvers were not staged source answers,
    evaluator internals, or the judge endpoint; this is recorded as an environment
    cross-case exposure risk rather than observed source-answer leakage.
